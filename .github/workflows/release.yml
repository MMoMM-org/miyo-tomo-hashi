name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write # OIDC token for sigstore signing of build provenance
    attestations: write # write the artifact attestation for released assets

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build

            - run: npm test

            # The main-branch ruleset requires CodeQL results for every commit,
            # which semantic-release's own release commit can never have. The
            # GitHub Actions app cannot be a ruleset bypass actor, so the push
            # runs as our own release GitHub App, which is a bypass actor
            # (#187). Merges via PR stay CodeQL-gated. The `[skip ci]` in the
            # release commit message keeps the app's push from retriggering
            # workflows (unlike GITHUB_TOKEN, an app token would).
            - name: Mint release app token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
              run: npx semantic-release

            # Provenance for the released assets. semantic-release rebuilds
            # build/ during its prepare step (version-bump + npm run build), so
            # by the time it finishes the on-disk files are the exact bytes it
            # uploaded — attesting them here yields matching digests. Verify a
            # downloaded asset with: gh attestation verify main.js --repo MMoMM-org/miyo-tomo-hashi
            - name: Attest build provenance
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: |
                      build/main.js
                      build/manifest.json
                      build/styles.css
