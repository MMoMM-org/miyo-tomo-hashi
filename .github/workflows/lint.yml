name: CI

# Runs on pull requests (every target branch) and on pushes to main, i.e. merges.
# Plain pushes to feature branches do not trigger CI; open a PR to get checks.
on:
    push:
        branches: [main]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                # Node 22 only: Node 20 is end-of-life (April 2026),
                # and the plugin itself runs in Obsidian's Electron, not in this Node.
                node-version: [22.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            - run: npm test
            - run: npm run lint
